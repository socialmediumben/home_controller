<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="cryptFloor" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <pattern id="stoneTiles" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
      <rect x="5" y="5" width="70" height="70" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,8" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#cryptFloor)" />
  <rect width="1200" height="800" fill="url(#stoneTiles)" opacity="0.7" />

  <!-- Heavy Outer Walls -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#475569" stroke-width="30" rx="12" />

  <!-- Stone Pillars with Torches -->
  <g fill="#334155" stroke="#1E293B" stroke-width="4">
    <rect x="250" y="180" width="60" height="60" rx="6" />
    <rect x="250" y="560" width="60" height="60" rx="6" />
    <rect x="890" y="180" width="60" height="60" rx="6" />
    <rect x="890" y="560" width="60" height="60" rx="6" />
  </g>
  <!-- Torch lights on pillars -->
  <g fill="#10B981" opacity="0.8">
    <circle cx="280" cy="210" r="14" />
    <circle cx="280" cy="590" r="14" />
    <circle cx="920" cy="210" r="14" />
    <circle cx="920" cy="590" r="14" />
  </g>

  <!-- Central Grand Sarcophagus of the King -->
  <g transform="translate(480, 280)">
    <!-- Base slab -->
    <rect x="0" y="0" width="240" height="240" rx="10" fill="#0F172A" stroke="#64748B" stroke-width="6" />
    <!-- Lid with carved effigy -->
    <rect x="30" y="20" width="180" height="200" rx="6" fill="#1E293B" stroke="#94A3B8" stroke-width="3" />
    <circle cx="120" cy="70" r="28" fill="#64748B" />
    <polygon points="120,105 80,190 160,190" fill="#475569" />
  </g>

  <!-- Side Tombs (North & South) -->
  <g fill="#1E293B" stroke="#475569" stroke-width="4">
    <rect x="420" y="70" width="140" height="70" rx="4" />
    <rect x="640" y="70" width="140" height="70" rx="4" />
    <rect x="420" y="660" width="140" height="70" rx="4" />
    <rect x="640" y="660" width="140" height="70" rx="4" />
  </g>
</svg>

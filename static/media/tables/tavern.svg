<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="tavFloor" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#1C0A00" />
    </radialGradient>
    <pattern id="planks" width="140" height="40" patternUnits="userSpaceOnUse">
      <rect width="140" height="40" fill="#451A03" stroke="#291102" stroke-width="2" />
      <line x1="70" y1="0" x2="70" y2="40" stroke="#291102" stroke-width="1.5" />
    </pattern>
    <filter id="hearthGlow">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#tavFloor)" />
  <rect width="1200" height="800" fill="url(#planks)" opacity="0.6" />

  <!-- Outer Walls -->
  <rect x="20" y="20" width="1160" height="760" fill="none" stroke="#78350F" stroke-width="24" rx="16" />

  <!-- Fireplace Hearth (Top Center) -->
  <g transform="translate(500, 20)">
    <rect x="0" y="0" width="200" height="60" rx="4" fill="#374151" stroke="#1F2937" stroke-width="4" />
    <path d="M 30 60 Q 100 10 170 60 Z" fill="#EF4444" filter="url(#hearthGlow)" />
    <path d="M 50 60 Q 100 25 150 60 Z" fill="#F59E0B" filter="url(#hearthGlow)" />
  </g>

  <!-- The L-Shaped Bar Counter & Stools -->
  <path d="M 100 160 L 380 160 L 380 440 L 300 440 L 300 240 L 100 240 Z" fill="#78350F" stroke="#451A03" stroke-width="6" />
  <!-- Ale Barrels behind bar -->
  <g fill="#92400E" stroke="#451A03" stroke-width="2">
    <ellipse cx="140" cy="90" rx="28" ry="18" />
    <ellipse cx="210" cy="90" rx="28" ry="18" />
    <ellipse cx="280" cy="90" rx="28" ry="18" />
  </g>

  <!-- Round Patron Tables & Chairs -->
  <!-- Table 1 -->
  <g transform="translate(560, 260)">
    <circle cx="0" cy="0" r="60" fill="#78350F" stroke="#451A03" stroke-width="5" />
    <circle cx="-75" cy="0" r="18" fill="#54240B" />
    <circle cx="75" cy="0" r="18" fill="#54240B" />
    <circle cx="0" cy="-75" r="18" fill="#54240B" />
    <circle cx="0" cy="75" r="18" fill="#54240B" />
  </g>

  <!-- Table 2 -->
  <g transform="translate(860, 260)">
    <circle cx="0" cy="0" r="60" fill="#78350F" stroke="#451A03" stroke-width="5" />
    <circle cx="-75" cy="0" r="18" fill="#54240B" />
    <circle cx="75" cy="0" r="18" fill="#54240B" />
    <circle cx="0" cy="-75" r="18" fill="#54240B" />
    <circle cx="0" cy="75" r="18" fill="#54240B" />
  </g>

  <!-- Large Long Feast Table (Bottom Right) -->
  <g transform="translate(620, 540)">
    <rect x="0" y="0" width="380" height="90" rx="10" fill="#78350F" stroke="#451A03" stroke-width="6" />
    <!-- Benches -->
    <rect x="0" y="-40" width="380" height="24" rx="4" fill="#54240B" />
    <rect x="0" y="105" width="380" height="24" rx="4" fill="#54240B" />
  </g>
</svg>

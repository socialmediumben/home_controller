<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="shadowBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#shadowBg)" />

  <!-- Wisps of Mist -->
  <path d="M 100 500 Q 300 400 500 550 T 700 450" stroke="#27272A" stroke-width="40" fill="none" opacity="0.3" />
  <path d="M 50 650 Q 250 550 450 700 T 750 600" stroke="#18181B" stroke-width="60" fill="none" opacity="0.5" />

  <!-- Pair of Glowing Golden Eyes in Deep Darkness -->
  <g filter="url(#eyeGlow)">
    <ellipse cx="360" cy="420" rx="20" ry="10" fill="#FACC15" />
    <ellipse cx="440" cy="420" rx="20" ry="10" fill="#FACC15" />
    <ellipse cx="360" cy="420" rx="3" ry="10" fill="#000000" />
    <ellipse cx="440" cy="420" rx="3" ry="10" fill="#000000" />
  </g>

  <g transform="translate(150, 910)">
    <rect x="0" y="0" width="500" height="60" rx="8" fill="#09090B" stroke="#52525B" stroke-width="2" />
    <text x="250" y="38" font-family="Cinzel, Georgia, serif" font-size="24" font-weight="bold" fill="#71717A" text-anchor="middle" letter-spacing="3">UNSEEN STALKER</text>
  </g>
</svg>

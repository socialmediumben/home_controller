<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/static/css/display.css?v=1.3.6">
</head>
<body>
  <div class="display-viewport">
    <!-- Weather Canvas for Window TV -->
    <canvas id="weatherCanvas" class="weather-canvas"></canvas>

    <!-- Crossfading Media Layers -->
    <div id="layerA" class="display-layer active media-container"></div>
    <div id="layerB" class="display-layer media-container"></div>

    <!-- Live Mirror Container (Direct Low-Latency Frame Stream) -->
    <div id="mirrorLayer" class="display-layer mirror-layer" style="display: none;">
      <canvas id="mirrorCanvas" class="mirror-canvas"></canvas>
    </div>

    <!-- Gothic Window Mullions Overlay (53" TV) -->
    <div id="gothicMullions" class="gothic-mullions" style="display: none;">
      <div class="window-pane"></div>
      <div class="window-pane"></div>
      <div class="window-pane"></div>
      <div class="window-pane"></div>
      <div class="window-pane"></div>
      <div class="window-pane"></div>
    </div>

    <!-- Ornate Gilded Picture Frame (Picture Frame Monitor) -->
    <div id="ornateFrame" class="ornate-picture-frame" style="display: none;"></div>
    <div id="captionBanner" class="portrait-caption-banner" style="display: none;">
      <span id="captionText">Portrait</span>
    </div>

    <!-- Tactical Grid Overlay (Table Projector) -->
    <svg id="gridSvg" class="tactical-grid-overlay" width="100%" height="100%" style="display: none;">
      <defs>
        <pattern id="gridPattern" width="22" height="22" patternUnits="userSpaceOnUse">
          <path d="M 22 0 L 0 0 0 22" fill="none" stroke="rgba(255, 215, 0, 0.35)" stroke-width="1.5" />
        </pattern>
      </defs>
      <rect id="gridRect" width="100%" height="100%" fill="url(#gridPattern)" />
    </svg>

    <!-- Floating Toolbar (Hover to show) -->
    <div class="display-toolbar">
      <span id="mirrorBadge" class="mirror-live-badge" style="display: none;">● LIVE MIRROR</span>
      <span id="screenLabel" class="screen-label">v1.3.6 - DISPLAY</span>
      <button id="fsBtn" class="toolbar-btn" title="Toggle Fullscreen">⛶ Fullscreen</button>
    </div>
  </div>

  <script src="/static/js/display.js?v=1.3.6"></script>
</body>
</html>
